# Nightly haze forecast and the website.
# The site and the model state (NEA readings archive, fire grids, peat dryness, past forecasts) live on the
# gh-pages branch, which is replaced by one new commit each run. GitHub Pages serves that branch.
name: Forecast and publish

on:
  schedule:
    - cron: "25 16 * * *"     # 00:25 Singapore time: NEA readings to 23:00 are in
    - cron: "40 18 * * *"     # 02:40, 05:10 and 07:10 Singapore time: more tries. GitHub sometimes starts a
    - cron: "10 21 * * *"     # scheduled run very late or not at all. A try does nothing when the forecast of
    - cron: "10 23 * * *"     # the night is already there.
  workflow_dispatch:
    inputs:
      forecast:
        description: "Run a new forecast (off: only publish the page code)"
        type: boolean
        default: true
  push:                       # publish the new code. After 01:00 Singapore time, also make the forecast of the
                              # night if it is not there yet; else test a full forecast run (output thrown away).
    branches: [main]
    paths: ["site/**", "pipeline/**", "requirements.txt", ".github/workflows/forecast.yml"]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Get the published site and the model state
        run: |
          mkdir -p _old/data _old/state
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth=1 origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
            git archive origin/gh-pages | tar -x -C _old
          fi
          ls -la _old/state

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: _work
          key: work-${{ github.run_id }}
          restore-keys: work-

      - name: Forecast
        id: forecast
        if: github.event_name != 'workflow_dispatch' || inputs.forecast
        shell: bash
        env:
          HAZE_STATE: _old/state
          HAZE_WORK: _work
          HAZE_SITE_DATA: _old/data
          DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "25 16 * * *" ]; then
            python -m pipeline.run
            echo "ran=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "$(TZ=Asia/Singapore date +%H)" = "00" ]; then
            echo "Push before 01:00 Singapore time: the nightly run makes the forecast."
          else
            python -m pipeline.run --skip-if-done | tee run.log
            if grep -q "is already there" run.log; then
              if [ "${{ github.event_name }}" = "schedule" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
            else
              echo "ran=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Prune old downloads
        run: find _work -type f -mtime +7 -delete 2> /dev/null || true

      - name: Build the site
        if: steps.forecast.outputs.skip != 'true'
        run: |
          mkdir -p _site
          cp -r site/. _site/
          for f in forecast.json map.json history.json og.png; do
            if [ -f "_old/data/$f" ]; then cp "_old/data/$f" _site/data/; fi
          done
          cp -r _old/state _site/state
          touch _site/.nojekyll
          ls -la _site _site/data

      - name: Publish (gh-pages)
        if: steps.forecast.outputs.skip != 'true'
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Forecast and site, $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Test a full forecast run (push only; the output is thrown away)
        if: github.event_name == 'push' && steps.forecast.outputs.ran != 'true'
        env:
          HAZE_STATE: _test/state
          HAZE_WORK: _work
          HAZE_SITE_DATA: _test/data
        run: |
          mkdir -p _test/data
          cp -r _old/state _test/state
          python -m pipeline.run
